# Spring Boot Configuration
spring.application.name=ishadya-task-tracker
server.port=8080

# MySQL Database Configuration - Please replace the placeholders for DB_URL, DB_USERNAME and DB_PASSWORD
spring.datasource.url=${DB_URL}     
        # ex: spring.datasource.url=jdbc:mysql://localhost:3306/task_tracker                           
spring.datasource.username=${DB_USERNAME}
        # ex: spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
        # ex: spring.datasource.password=your_mysqlServer_password

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=Task_tracker2000_ish-jwt-key-secret-2026
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.ishadya.tasktracker=DEBUG
logging.level.org.springframework.security=DEBUG
